[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorbound-study"
version = "0.1.0"
description = "Evidence and analysis infrastructure for the TensorBound empirical study"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "TensorBound authors"}]
dependencies = []

[project.scripts]
tensorbound = "tensorbound.cli:main"

[tool.setuptools]
packages = ["tensorbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
